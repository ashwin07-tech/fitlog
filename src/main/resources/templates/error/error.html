<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice — FitLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-heart-pulse-fill text-danger me-2"></i>Fit<span class="text-primary">Log</span>
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow rounded-4 text-center p-4 p-md-5 bg-white">
                <div class="mb-3">
                    <span class="badge bg-warning bg-opacity-10 text-warning p-3 rounded-circle"
                          th:if="${status == 200 || status == 400 || status == 404}">
                        <i class="bi bi-exclamation-circle-fill display-5"></i>
                    </span>
                    <span class="badge bg-danger bg-opacity-10 text-danger p-3 rounded-circle"
                          th:unless="${status == 200 || status == 400 || status == 404}">
                        <i class="bi bi-x-circle-fill display-5"></i>
                    </span>
                </div>

                <span class="badge bg-secondary text-uppercase mb-2 align-self-center"
                      th:text="'HTTP ' + ${status}">HTTP 400</span>

                <h3 class="fw-bold mb-3" th:text="${title}">Notice</h3>

                <div class="alert alert-light border text-start mb-4">
                    <p class="mb-0 fw-semibold text-dark" th:text="${message}">
                        A business rule or summary condition was not met.
                    </p>
                </div>

                <p class="text-muted mb-4 small" th:if="${suggestion}" th:text="${suggestion}">
                    Suggestions on how to resolve this.
                </p>

                <div class="d-flex justify-content-center gap-2">
                    <a href="/" class="btn btn-primary px-4">
                        <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
