# ===================================================================
# FitLog Application Configuration
# ===================================================================

spring.application.name=fitlog
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/fitlog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ashwin@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate Properties
# -------------------------------------------------------------------
# Automatically create/update schema based on JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Date and Time Formatting
# -------------------------------------------------------------------
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.fitlog=INFO
logging.level.org.hibernate.SQL=DEBUG
